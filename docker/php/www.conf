[www]
; Sized for a 1 GB container: max_children ~ (memory for PHP) / (average worker RSS, ~40 MB).
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers to contain slow memory leaks in extensions.
pm.max_requests = 1000

pm.status_path = /fpm-status
ping.path = /fpm-ping

; Log requests slower than 2s with a PHP stack trace.
request_slowlog_timeout = 2s
slowlog = /proc/self/fd/2

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
