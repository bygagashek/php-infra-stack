server {
    listen 80 default_server;
    server_name _;
    root /var/www/app/public;

    server_tokens off;
    client_max_body_size 2m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_read_timeout 30s;
    }

    # Any other .php file is never executed.
    location ~ \.php$ {
        return 404;
    }
}

# Internal endpoints for monitoring: not published to the host, reachable only inside the compose network.
server {
    listen 8081;

    location = /stub_status {
        stub_status;
    }

    location = /fpm-ping {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
    }
}
