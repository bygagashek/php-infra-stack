global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: nginx
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: php-fpm
    static_configs:
      - targets: ['php-fpm-exporter:9253']

  - job_name: mariadb
    static_configs:
      - targets: ['mysqld-exporter-primary:9104']
        labels: {role: primary}
      - targets: ['mysqld-exporter-replica:9104']
        labels: {role: replica}

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
