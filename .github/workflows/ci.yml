name: CI

on:
  push:
  pull_request:

jobs:
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate configs
        run: |
          docker compose config --quiet
          docker run --rm -v "$PWD/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            --add-host php:127.0.0.1 nginx:1.27-alpine nginx -t
          docker run --rm --entrypoint promtool -v "$PWD/docker/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test
        run: scripts/smoke-test.sh

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
