name: php-infra-stack

x-mariadb-env: &mariadb-env
  MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
  MARIADB_DATABASE: app
  MARIADB_USER: app
  MARIADB_PASSWORD: ${DB_PASSWORD:-app}
  MARIADB_INITDB_SKIP_TZINFO: 1
  REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl}
  EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:-exporter}

x-mariadb-healthcheck: &mariadb-healthcheck
  test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
  interval: 5s
  timeout: 5s
  retries: 60
  # The first start initializes the data directory and can take minutes on slow disks.
  start_period: 600s
  start_interval: 5s

services:
  # --- application -----------------------------------------------------------

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/public:/var/www/app/public:ro
    depends_on:
      - php
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/fpm-ping"]
      interval: 5s
      retries: 30

  php:
    build: ./docker/php
    volumes:
      - ./app:/var/www/app:ro
    environment:
      DB_PRIMARY_HOST: mariadb-primary
      DB_REPLICA_HOST: mariadb-replica
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-app}
      REDIS_HOST: redis
    depends_on:
      mariadb-primary:
        condition: service_healthy
      mariadb-replica:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- data ------------------------------------------------------------------

  mariadb-primary:
    image: mariadb:${MARIADB_TAG:-11.4}
    environment: *mariadb-env
    volumes:
      - ./docker/mariadb/primary/primary.cnf:/etc/mysql/conf.d/primary.cnf:ro
      - ./docker/mariadb/primary/init:/docker-entrypoint-initdb.d:ro
      - primary-data:/var/lib/mysql
    healthcheck: *mariadb-healthcheck

  mariadb-replica:
    image: mariadb:${MARIADB_TAG:-11.4}
    # No MARIADB_DATABASE / MARIADB_USER here: the primary writes them to the binlog,
    # and creating them locally as well would break replication on a duplicate CREATE USER.
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_INITDB_SKIP_TZINFO: 1
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-repl}
    volumes:
      - ./docker/mariadb/replica/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
      - ./docker/mariadb/replica/init:/docker-entrypoint-initdb.d:ro
      - replica-data:/var/lib/mysql
    depends_on:
      mariadb-primary:
        condition: service_healthy
    healthcheck: *mariadb-healthcheck

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  # --- monitoring ------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/stack.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      - nginx

  php-fpm-exporter:
    image: hipages/php-fpm_exporter:2.2.0
    environment:
      PHP_FPM_SCRAPE_URI: tcp://php:9000/fpm-status
    depends_on:
      - php

  mysqld-exporter-primary:
    image: prom/mysqld-exporter:v0.16.0
    command: ["--mysqld.address=mariadb-primary:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:-exporter}
    depends_on:
      mariadb-primary:
        condition: service_healthy

  mysqld-exporter-replica:
    image: prom/mysqld-exporter:v0.16.0
    command: ["--mysqld.address=mariadb-replica:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:-exporter}
    depends_on:
      mariadb-replica:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

volumes:
  primary-data:
  replica-data:
  prometheus-data:
